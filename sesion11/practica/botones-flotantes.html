<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Botones flotantes WhatsApp e Instagram</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 40px 20px; min-height: 150vh; background: #f6f7f9; color: #222; }

  /* ===== BOTONES FLOTANTES (copiar desde aquí) ===== */
  .social-float {
    position: fixed;
    right: 24px;
    bottom: 24px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .social-btn {
    position: relative;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 18px rgba(0,0,0,.25);
    text-decoration: none;
    transition: transform .2s ease, box-shadow .2s ease;
    animation: social-shake 4s ease-in-out infinite;
  }
  .social-btn svg { width: 32px; height: 32px; position: relative; z-index: 1; }

  /* Ondas que salen de cada botón */
  .social-btn::before,
  .social-btn::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: inherit;
    z-index: 0;
    animation: social-pulse 2s ease-out infinite;
  }
  .social-btn::after { animation-delay: 1s; }

  .social-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 8px 24px rgba(0,0,0,.3);
    animation-play-state: paused;
  }

  /* WhatsApp */
  .social-btn--wa { background: #25D366; }
  .social-btn--wa svg { fill: #fff; }

  /* Instagram (degradado de la marca) */
  .social-btn--ig {
    background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
    animation-delay: 2s; /* se sacude en otro momento que WhatsApp */
  }
  .social-btn--ig svg { fill: none; stroke: #fff; stroke-width: 2.2; }

  /* Globo de texto al pasar el mouse */
  .social-tooltip {
    position: absolute;
    right: 72px;
    white-space: nowrap;
    background: #fff;
    color: #222;
    font: 600 14px/1 system-ui, sans-serif;
    padding: 10px 14px;
    border-radius: 8px;
    box-shadow: 0 4px 12px rgba(0,0,0,.15);
    opacity: 0;
    transform: translateX(8px);
    transition: opacity .2s ease, transform .2s ease;
    pointer-events: none;
    z-index: 2;
  }
  .social-btn:hover .social-tooltip { opacity: 1; transform: translateX(0); }

  @keyframes social-pulse {
    0%   { transform: scale(1);   opacity: .6; }
    100% { transform: scale(1.8); opacity: 0; }
  }

  /* Pequeña sacudida cada 4 segundos */
  @keyframes social-shake {
    0%, 80%, 100% { transform: rotate(0); }
    84% { transform: rotate(-15deg); }
    88% { transform: rotate(15deg); }
    92% { transform: rotate(-10deg); }
    96% { transform: rotate(8deg); }
  }

  /* Respeta a quienes prefieren menos movimiento */
  @media (prefers-reduced-motion: reduce) {
    .social-btn, .social-btn::before, .social-btn::after { animation: none; }
  }

  @media (max-width: 600px) {
    .social-float { right: 16px; bottom: 16px; gap: 12px; }
    .social-btn { width: 54px; height: 54px; }
    .social-btn svg { width: 28px; height: 28px; }
    .social-tooltip { display: none; }
  }
  /* ===== FIN ESTILOS ===== */
</style>
</head>
<body>

  <h1>Página de ejemplo</h1>
  <p>Los botones aparecen abajo a la derecha. Haz scroll: siempre quedan visibles.</p>

  <!-- ===== BOTONES FLOTANTES (copiar desde aquí) =====
       WhatsApp: cambia 573001234567 por tu número (código de país + número, sin + ni espacios).
       Instagram: cambia "tuusuario" por tu usuario de Instagram. -->
  <div class="social-float">

    <a class="social-btn social-btn--ig"
       href="https://www.instagram.com/tuusuario/"
       target="_blank" rel="noopener"
       aria-label="Síguenos en Instagram">
      <span class="social-tooltip">Síguenos en Instagram</span>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="5"/>
        <circle cx="12" cy="12" r="4.2"/>
        <circle cx="17.4" cy="6.6" r="1" fill="#fff" stroke="none"/>
      </svg>
    </a>

    <a class="social-btn social-btn--wa"
       href="https://wa.me/573001234567?text=Hola%2C%20quiero%20m%C3%A1s%20informaci%C3%B3n"
       target="_blank" rel="noopener"
       aria-label="Escríbenos por WhatsApp">
      <span class="social-tooltip">¿Hablamos por WhatsApp?</span>
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16.004 3C8.82 3 3 8.82 3 16c0 2.29.6 4.53 1.74 6.5L3 29l6.67-1.71A12.95 12.95 0 0 0 16.004 29C23.18 29 29 23.18 29 16S23.18 3 16.004 3zm0 23.66c-2 0-3.96-.54-5.670-1.56l-.41-.24-3.96 1.02 1.06-3.86-.27-.4A10.6 10.6 0 0 1 5.34 16c0-5.88 4.78-10.66 10.66-10.66S26.66 10.12 26.66 16 21.88 26.66 16.004 26.66zm5.85-7.98c-.32-.16-1.890-.93-2.18-1.04-.29-.11-.5-.16-.72.16-.21.32-.82 1.04-1.01 1.25-.19.21-.37.24-.69.08-.32-.16-1.35-.5-2.57-1.59-.95-.85-1.59-1.9-1.78-2.22-.19-.32-.02-.49.14-.65.14-.14.32-.37.48-.56.16-.19.21-.32.32-.53.11-.21.05-.4-.03-.56-.08-.16-.72-1.73-.98-2.37-.26-.62-.52-.54-.72-.55h-.61c-.21 0-.56.08-.85.4-.29.32-1.12 1.09-1.12 2.66s1.15 3.09 1.31 3.3c.16.21 2.26 3.45 5.470 4.84.76.33 1.36.53 1.83.68.77.24 1.47.21 2.02.13.62-.09 1.89-.77 2.16-1.52.27-.75.27-1.39.19-1.52-.08-.13-.29-.21-.61-.37z"/>
      </svg>
    </a>

  </div>
  <!-- ===== FIN BOTONES ===== -->

</body>
</html>
